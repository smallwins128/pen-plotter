<!doctype html>
<!-- Room R05 Harbor (Copilot harness). 15 s vertical reel of the room coming together. Dated output, not the room record:
     the room as built lives in lofi/room3d.html. Render to MP4 with render_reel.js. Open in a browser to preview (scrub with ?t=). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Reel</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:800;src:url(../../labels/fonts/BarlowCondensed-ExtraBold.ttf)}
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url(../../labels/fonts/BarlowCondensed-Medium.ttf)}
@font-face{font-family:"Plex Mono";font-weight:600;src:url(../../labels/fonts/IBMPlexMono-SemiBold.ttf)}
:root{--bg:#101214;--ink:#f4efe8;--hot:#ff7a2f;--mute:#9aa0a3}
html,body{margin:0;background:var(--bg);overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;transform-origin:0 0}
#stage canvas{display:block}
#scrim{position:absolute;left:0;right:0;top:0;height:900px;background:linear-gradient(rgba(8,9,10,.62),rgba(8,9,10,0));pointer-events:none}
.cap{position:absolute;left:84px;right:84px;top:300px;font-family:"Barlow Condensed";font-weight:800;color:var(--ink);
  font-size:168px;line-height:.9;text-transform:uppercase;letter-spacing:-.01em;opacity:0;text-shadow:0 6px 40px rgba(0,0,0,.45)}
.cap em{font-style:normal;color:var(--hot)}
.cap small{display:block;margin-top:22px;font-family:"Plex Mono";font-weight:600;font-size:38px;letter-spacing:.04em;color:var(--ink);opacity:.85;line-height:1.3}
#day{position:absolute;left:88px;top:220px;font-family:"Plex Mono";font-weight:600;font-size:36px;letter-spacing:.12em;color:var(--hot)}
#bar{position:absolute;left:88px;right:88px;top:200px;height:4px;background:rgba(255,255,255,.15)}
#bar i{display:block;height:100%;width:0;background:var(--hot)}
</style>
<div id="stage">
<div id="scrim"></div>
<div id="bar"><i></i></div>
<div id="day"></div>
<div class="cap" data-in="0.15" data-out="1.65">One spare<br>room<small>3.3 × 3.8 m · one wall to work with</small></div>
<div class="cap" data-in="1.85" data-out="3.9"><em>→</em> A<br>workshop</div>
<div class="cap" data-in="4.3" data-out="6.1">Board<br><em>up</em><small>12 mm ply · french cleat</small></div>
<div class="cap" data-in="6.25" data-out="8.7">Every screw<br>has a <em>home</em><small>3 rows of bins · colour-coded</small></div>
<div class="cap" data-in="9.9" data-out="12.5"><em>Next →</em><small>printer tower · island bench</small></div>
<div class="cap" data-in="12.75" data-out="15.5">Harbor<small>workshop build · part 1</small></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W=3.3,L=3.8,H=2.6,DUR=15,FPS=30;
const PAL={floor:0xc8a27a,plank:0x9c7650,wall:0xe9e4dc,wallC:0xaebda8,plan:0xff7a2f};

// Ease helpers
const cl=(x)=>Math.min(1,Math.max(0,x));
const ioC=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ioQ=(x)=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2;
const oB=(x)=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const oC=(x)=>1-Math.pow(1-x,3);

// Items: box [x0,x1,y0,y1,z0,z1] in room metres (same frame as room3d.html). at = appear time, fx = drop | pop | slide | fade.
const ITEMS=[
 {box:[0,0.6,0,2.1,0.05,1.05],c:0xcfc8bd,at:1.75,fx:'drop'},
 {box:[0,0.6,0,2.1,1.05,2.05],c:0x7fa7c9,at:1.87,fx:'drop'},
 {box:[0,0.6,0,2.1,2.05,3.05],c:0xcfc8bd,at:1.99,fx:'drop'},
 {box:[0,0.6,0,2.1,3.05,3.7],c:0xcfc8bd,at:2.11,fx:'drop'},
 {box:[0,0.6,2.1,2.6,0.05,3.7],c:0xf1ece4,at:2.3,fx:'drop'},
 {box:[1.02,2.54,0.72,0.75,3.2,3.8],c:0xf4f4f2,at:2.45,fx:'drop',legs:true},
 {box:[1.56,2.5,0.75,0.95,3.25,3.75],c:0x9aa6ad,at:2.65,fx:'drop',wire:true},
 {box:[1.7,3.3,0.72,0.75,0,0.8],c:0x1c1c1c,at:2.75,fx:'drop',legs:true},           // UTESPELARE, laptop + monitor desk
 {box:[2.35,2.95,0.8,1.15,0.12,0.16],c:0x111111,at:3.0,fx:'pop',screen:true},     // monitor
 {box:[1.95,2.28,0.75,0.765,0.3,0.52],c:0x8a9096,at:3.1,fx:'pop',laptop:true},     // laptop
 {box:[2.7,3.3,0.71,0.75,0.8,2.0],c:0xf2f0ec,at:3.2,fx:'drop',legs:true},          // LINNMON under the board
 {box:[3.29,3.3,0.25,0.33,0.48,0.56],c:0xe0702a,at:3.3,fx:'pop'},
 {box:[3.29,3.3,1.2,1.3,2.52,2.6],c:0xf5f5f5,at:3.35,fx:'pop'},
 {box:[3.2,3.28,0,0.56,2.56,2.96],c:0xf4f4f2,at:3.4,fx:'drop'},
 // wall C build, the hero
 {box:[3.248,3.26,0.925,1.839,0.55,2.379],c:0x161616,at:4.35,fx:'slide',from:[-0.9,0.12,0],d:.55,clunk:true},
 {box:[3.235,3.248,1.21,1.77,0.565,1.325],c:0xf4f4f2,at:5.15,fx:'pop'},
 {box:[3.1,3.248,1.005,1.02,0.53,1.42],c:0x2a2a2a,at:5.55,fx:'slide',from:[-0.4,0,0],d:.35},
];
// 12 bins, row by row, bottom first: the beat
{const z0=1.34,zw=0.47/4,y0=1.085,yh=0.375/3;
 for(let r=0;r<3;r++)for(let k=0;k<4;k++)ITEMS.push({box:[3.13,3.245,y0+r*yh+0.01,y0+(r+1)*yh-0.012,z0+k*zw+0.006,z0+(k+1)*zw-0.006],
   c:[0x8f979b,0x8f979b,0x8f979b][r],at:6.1+r*0.42+k*0.09,fx:'pop',bin:r*4+k});}
ITEMS.push({box:[3.2,3.245,1.61,1.645,1.34,1.77],c:0x2f5fd0,at:7.6,fx:'slide',from:[0,0.35,0],d:.35,clunk:true});
// plans: glowing outlines only
const PLANS=[
 {box:[2.69,3.3,0.0,1.2,2.05,2.66],at:10.3},    // 2 x 2 ft printer tower after the LINNMON, Bambu A1 on top
 {box:[1.6,2.2,0.0,0.88,1.5,2.42],at:10.8},     // island bench
];

const stage=document.getElementById('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101214);
scene.fog=new THREE.Fog(0x101214,9,16);
const camera=new THREE.PerspectiveCamera(50,1080/1920,0.05,60);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1080,1920);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
stage.prepend(renderer.domElement);
const fit=()=>{const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s})`;};addEventListener('resize',fit);fit();

scene.add(new THREE.HemisphereLight(0xfff4e6,0x2a3036,1.25));
const sun=new THREE.DirectionalLight(0xfff1dc,2.2);sun.position.set(-1.5,6,-2.5);sun.target.position.set(W/2,0,L/2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:14});sun.shadow.bias=-0.0006;
scene.add(sun,sun.target);
const fill=new THREE.PointLight(0xffb27a,6,6,1.6);fill.position.set(1.4,2.3,1.5);scene.add(fill);
const key=new THREE.SpotLight(0xfff0dd,14,5,0.7,0.6,1.2);key.position.set(1.4,2.4,1.3);key.target.position.set(3.25,1.35,1.46);scene.add(key,key.target);

// floor with plank lines
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshStandardMaterial({color:PAL.floor,roughness:.75}));
floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,L/2);floor.receiveShadow=true;scene.add(floor);
{const pts=[];for(let x=0.14;x<W;x+=0.14)pts.push(x,0.001,0,x,0.001,L);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
 scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:PAL.plank,transparent:true,opacity:.35})));}

// walls rise out of the floor; single-sided so the near ones vanish
const walls=[];
const wall=(w,pos,rotY,col)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,H),new THREE.MeshStandardMaterial({color:col,roughness:.95}));
  m.position.copy(pos);m.rotation.y=rotY;m.receiveShadow=true;scene.add(m);walls.push(m);};
wall(L,new THREE.Vector3(0,H/2,L/2),Math.PI/2,PAL.wall);
wall(L,new THREE.Vector3(W,H/2,L/2),-Math.PI/2,PAL.wallC);
wall(W,new THREE.Vector3(W/2,H/2,0),0,PAL.wall);
wall(W,new THREE.Vector3(W/2,H/2,L),Math.PI,PAL.wall);
const win=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.2),new THREE.MeshStandardMaterial({color:0xbfe0f2,emissive:0x6fa6c8,emissiveIntensity:.6}));
win.position.set(2.1,1.5,0.006);scene.add(win);
const door=new THREE.Mesh(new THREE.PlaneGeometry(0.75,2.05),new THREE.MeshStandardMaterial({color:0x3a2a1a}));
door.position.set(W-0.006,1.025,3.375);door.rotation.y=-Math.PI/2;scene.add(door);
const wallBits=[win,door];

const objs=ITEMS.map(it=>{
  const [x0,x1,y0,y1,z0,z1]=it.box;const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  const mat=new THREE.MeshStandardMaterial({color:it.c,roughness:.6,transparent:true,opacity:it.wire?0.18:1});
  const m=new THREE.Mesh(g,mat);m.castShadow=!it.wire;m.receiveShadow=true;
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:it.wire?0x1c2328:0x000000,transparent:true,opacity:it.wire?.9:.22}));m.add(e);
  const grp=new THREE.Group();grp.add(m);
  if(it.legs)[[x0+0.04,z0+0.04],[x1-0.04,z0+0.04],[x0+0.04,z1-0.04],[x1-0.04,z1-0.04]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,y0),new THREE.MeshStandardMaterial({color:0x222222}));
    leg.position.set(lx-(x0+x1)/2,-(y1-y0)/2-y0/2,lz-(z0+z1)/2);leg.castShadow=true;grp.add(leg);});
  // sawhorse: the box is the top beam; four splayed legs hang from it
  if(it.horse)[-1,1].forEach(sx=>[-1,1].forEach(sz=>{const leg=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.68,0.035),new THREE.MeshStandardMaterial({color:it.c,roughness:.6}));
    leg.position.set(sx*((x1-x0)/2-0.06),-0.34,sz*0.09);leg.rotation.x=sz*0.28;leg.castShadow=true;grp.add(leg);}));
  if(it.screen){const sc=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0-0.03,y1-y0-0.03),new THREE.MeshBasicMaterial({color:0x7fb8ff}));
    sc.position.set(0,0,(z1-z0)/2+0.001);grp.add(sc);}
  if(it.laptop){const lid=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,0.21,0.008),new THREE.MeshStandardMaterial({color:it.c}));
    lid.position.set(0,0.1,-(z1-z0)/2+0.02);lid.rotation.x=-0.25;grp.add(lid);
    const sc=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0-0.03,0.18),new THREE.MeshBasicMaterial({color:0xffd9a8}));sc.position.set(0,0,0.005);lid.add(sc);}
  if(it.bin!==undefined){const lab=new THREE.Mesh(new THREE.PlaneGeometry(0.06,0.018),new THREE.MeshBasicMaterial({color:[0xd23b2a,0xe0702a,0xe8c22e,0x3b9a4a,0x2f6fd0,0x8a4fc4,0x7a7a7a,0xf4f4f2,0x8b5a2b,0x111111,0xd23b2a,0xe0702a][it.bin]}));
    lab.position.set(-(x1-x0)/2-0.001,0.01,0);lab.rotation.y=-Math.PI/2;grp.add(lab);}
  const home=new THREE.Vector3((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);grp.position.copy(home);scene.add(grp);
  return {it,grp,mat,home};
});
const plans=PLANS.map(p=>{
  const [x0,x1,y0,y1,z0,z1]=p.box;const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  const fillM=new THREE.MeshBasicMaterial({color:PAL.plan,transparent:true,opacity:0,depthWrite:false});
  const m=new THREE.Mesh(g,fillM);
  const lineM=new THREE.LineBasicMaterial({color:PAL.plan,transparent:true,opacity:0});
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),lineM));
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);scene.add(m);return {p,m,fillM,lineM};
});

// Camera keyframes: [time, position, target, fov, ease into this key]. Outside walls are single-sided, so the camera can sit beyond them.
const K=[
 [0,   [W/2,7.5,L+2.2],  [W/2,0.3,L/2-0.3], 50,null],
 [1.6, [W/2,5.6,L+1.2],  [W/2,0.4,L/2-0.3], 52,ioC],
 [4.0, [1.4,3.0,3.0],    [3.0,1.0,1.4],     58,ioC],
 [4.9, [1.15,1.55,0.95], [3.25,1.62,1.42],  68,ioC],
 [8.8, [1.65,1.5,1.1],   [3.25,1.6,1.5],    62,oC],
 [9.8, [1.0,4.8,5.3],    [2.5,0.45,1.5],    54,ioQ],
 [12.6,[1.4,5.6,5.8],    [2.4,0.4,1.5],     52,oC],
 [15,  [W/2,7.5,L+2.2],  [W/2,0.3,L/2-0.3], 50,ioC],
];
const v3=(a)=>new THREE.Vector3(...a);
function cam(t){
  let i=K.findIndex(k=>k[0]>t);if(i<0)i=K.length-1;if(i===0)i=1;
  const [ta,pa,qa,fa]=K[i-1],[tb,pb,qb,fb,ease]=K[i];const u=ease(cl((t-ta)/(tb-ta)));
  camera.position.copy(v3(pa).lerp(v3(pb),u));
  camera.lookAt(v3(qa).lerp(v3(qb),u));
  camera.fov=fa+(fb-fa)*u;camera.updateProjectionMatrix();
}

function seek(t){
  walls.forEach((w,i)=>{const u=oB(cl((t-0.1-i*0.08)/0.7));const s=Math.max(0.001,u);w.scale.y=s;w.position.y=H*s/2;});
  wallBits.forEach(b=>b.visible=t>0.8);
  objs.forEach(({it,grp,mat,home})=>{
    const d=it.d||0.45,u=cl((t-it.at)/d);grp.visible=t>=it.at;grp.position.copy(home);grp.scale.set(1,1,1);mat.opacity=it.wire?0.18:1;
    if(it.fx==='drop'){grp.position.y=home.y+1.6*(1-oB(u));}
    if(it.fx==='pop'){const s=Math.max(0.001,oB(u));grp.scale.set(s,s,s);}
    if(it.fx==='slide'){const e=oC(u);grp.position.add(v3(it.from).multiplyScalar(1-e));
      if(it.clunk){const k=cl((t-it.at-d)/0.25);grp.position.y-=0.02*Math.sin(k*Math.PI)*(k<1);}}
  });
  plans.forEach(({p,m,fillM,lineM})=>{const u=cl((t-p.at)/0.5);const pulse=0.5+0.5*Math.sin((t-p.at)*6);
    lineM.opacity=u;fillM.opacity=u*(0.3+0.15*pulse);const s=1+0.06*(1-oB(u));m.scale.set(s,s,s);});
  cam(t);
  document.querySelectorAll('.cap').forEach(c=>{const a=+c.dataset.in,b=+c.dataset.out;
    const i=cl((t-a)/0.28),o=cl((t-(b-0.22))/0.22),v=i*(1-o);c.style.opacity=v;c.style.transform=`translateY(${(1-oC(i))*60-o*30}px)`;});
  const day=Math.min(11,1+Math.floor(10*cl(t/12.6)));
  document.getElementById('day').textContent=`DAY ${String(day).padStart(2,'0')} · OCT ${15+day}`;
  document.querySelector('#bar i').style.width=(100*t/DUR)+'%';
  renderer.render(scene,camera);
}
window.seek=seek;window.REEL={DUR,FPS};
const q=new URLSearchParams(location.search);
if(q.has('t'))seek(+q.get('t'));
else if(!q.has('render')){const t0=performance.now();const loop=()=>{seek(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);};loop();}
await document.fonts.ready;window.READY=true;
</script>
