<title>Etch Order List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="css">
/* Layout: one column of category sections, each a list of parts with a three-way status (to order / ordered / have).
   Same tokens as the enclosure and parts inspectors: steel greys, one orange accent. */
:root {
  --bg: #eef0f1; --panel: #ffffff; --ink: #1d2226; --muted: #5d676f; --line: #d3d8dc;
  --accent: #c2410c; --accent-ink: #ffffff; --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
  --chip: #e8ebed;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191c; --panel: #1d2226; --ink: #e8ecef; --muted: #9aa5ad; --line: #333b41;
  --accent: #fb923c; --accent-ink: #1d2226; --ok: #4ade80; --ok-bg: #14301f; --warn: #fbbf24; --warn-bg: #3a2c0c;
  --chip: #262c31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191c; --panel: #1d2226; --ink: #e8ecef; --muted: #9aa5ad; --line: #333b41;
  --accent: #fb923c; --accent-ink: #1d2226; --ok: #4ade80; --ok-bg: #14301f; --warn: #fbbf24; --warn-bg: #3a2c0c;
  --chip: #262c31; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-size: 24px; letter-spacing: .01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; max-width: 65ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 12.5px var(--f-mono); color: var(--muted); }
.progress { flex: 1 1 200px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; display: flex; }
.progress i { display: block; height: 100%; }
.progress .p-ord { background: var(--accent); } .progress .p-have { background: var(--ok); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toggle { font: 600 12.5px var(--f-ui); padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.save { font: 12px var(--f-mono); color: var(--muted); }
.save.err { color: var(--warn); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
section > h2 { margin: 0; padding: 12px 16px; font-size: 15px; display: flex; gap: 10px; align-items: baseline;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
section > h2 .count { font: 12px var(--f-mono); color: var(--muted); font-weight: 400; }
section > p.note { margin: 0; padding: 10px 16px 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
ul { list-style: none; margin: 0; padding: 4px 0; }
li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 10px 16px;
  border-top: 1px solid var(--line); align-items: start; }
li:first-child { border-top: 0; }
.what { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.qty { font: 500 12.5px var(--f-mono); padding: 1px 7px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.spec { font: 12.5px var(--f-mono); color: var(--ink); opacity: .85; overflow-wrap: anywhere; }
.why { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.flag { font: 600 10.5px var(--f-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--warn);
  background: var(--warn-bg); padding: 2px 6px; border-radius: 4px; }
.status { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; align-self: center; }
.status button { font: 600 12px var(--f-ui); padding: 6px 9px; border: 0; border-right: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.status button:last-child { border-right: 0; }
.status button[aria-pressed="true"][data-s="todo"] { background: var(--chip); color: var(--ink); }
.status button[aria-pressed="true"][data-s="ordered"] { background: var(--accent); color: var(--accent-ink); }
.status button[aria-pressed="true"][data-s="have"] { background: var(--ok-bg); color: var(--ok); }
.status button:disabled { cursor: default; }
li.done .name, li.done .spec { opacity: .55; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.later { padding: 14px 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
footer { color: var(--muted); font-size: 12px; line-height: 1.5; }
@media (max-width: 560px) {
  li { grid-template-columns: 1fr; }
  .status { justify-self: start; }
}
@media (prefers-reduced-motion: no-preference) { .progress i { transition: width .3s; } }
</style>

<script id="app">
(function () {
  const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  const CATS = ["IEC panel", "Magnets", "Rivnuts", "Screws", "Nuts and washers", "COB lights", "Pen lifter"];
  const LABEL = { todo: "To order", ordered: "Ordered", have: "Have" };
  const data = JSON.parse(document.getElementById("data").textContent);
  const root = document.getElementById("root");
  let onlyTodo = false, artifact = null, readOnly = false, saveTimer = null, saveMsg = "";
  try { onlyTodo = sessionStorage.getItem("etch-only-todo") === "1"; } catch (e) {}

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render() {
    const n = data.items.length, ord = data.items.filter(i => i.status === "ordered").length,
          have = data.items.filter(i => i.status === "have").length;
    let html = `<header><h1>Etch order list</h1>
      <p class="sub">Parts for the enclosure (cut pack v5) and the pen lifter. Quantities come from the cut files and the
      pen-lifter model; anything marked <span class="flag">check</span> is an assumption to confirm before ordering.</p>
      <div class="bar"><span>${n - ord - have} to order · ${ord} ordered · ${have} have</span>
        <span class="progress" aria-hidden="true"><i class="p-have" style="width:${100 * have / n}%"></i><i class="p-ord" style="width:${100 * ord / n}%"></i></span></div>
      <div class="tools"><button class="toggle" id="onlyTodo" aria-pressed="${onlyTodo}">Show only to-order</button>
        <span class="save${saveMsg.startsWith("Couldn") ? " err" : ""}" id="save">${esc(saveMsg)}</span></div></header>`;
    for (const cat of CATS) {
      const items = data.items.filter(i => i.cat === cat && (!onlyTodo || i.status === "todo"));
      const all = data.items.filter(i => i.cat === cat), left = all.filter(i => i.status === "todo").length;
      if (!items.length && onlyTodo) continue;
      html += `<section><h2>${esc(cat)} <span class="count">${left ? left + " to order" : "all sorted"} · ${all.length} lines</span></h2><ul>`;
      for (const it of items) {
        html += `<li class="${it.status === "todo" ? "" : "done"}"><div class="what">
          <span class="name">${esc(it.name)} <span class="qty">× ${esc(it.qty)}</span>${it.flag ? ` <span class="flag" title="${esc(it.flag)}">check</span>` : ""}</span>
          <span class="spec">${esc(it.spec)}</span>
          <span class="why">${esc(it.why)}${it.flag ? ` <strong>${esc(it.flag)}.</strong>` : ""}</span></div>
          <div class="status" role="group" aria-label="Status of ${esc(it.name)}">${["todo", "ordered", "have"].map(s =>
            `<button data-id="${esc(it.id)}" data-s="${s}" aria-pressed="${it.status === s}"${readOnly ? " disabled" : ""}>${LABEL[s]}</button>`).join("")}</div></li>`;
      }
      html += `</ul></section>`;
    }
    html += `<section><h2>Later: fasteners for the ACRO plates <span class="count">waiting on the acrylic quote</span></h2>
      <p class="later">Once you decide on the ACRO frame, I'll add its screws, wheels, spacers and T-nuts here from the plate files.</p></section>
      <footer>${readOnly ? "View only: you can see the list, but changes here aren't saved." : "Changes save to this page a moment after you click, so they show up on every device."} Last updated ${esc(data.updated)}.</footer>`;
    root.innerHTML = html;
  }

  function documentHtml() {
    const json = JSON.stringify(data, null, 0).replace(/</g, "\\u003c");
    const css = document.getElementById("css").textContent, app = document.getElementById("app").textContent;
    return SKELETON + '<title>Etch Order List</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">\n' +
      '<style id="css">' + css + '</style>\n\n<div class="wrap" id="root"></div>\n\n' +
      '<script type="application/json" id="data">\n' + json + '\n</scr' + 'ipt>\n\n<script id="app">' + app + '</scr' + 'ipt>\n</body></html>';
  }

  function scheduleSave() {
    if (!artifact || readOnly) return;
    saveMsg = "Saving…"; clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      data.updated = new Date().toISOString().slice(0, 10);
      try { await artifact.publish(documentHtml()); }
      catch (e) {
        const code = e && e.code;
        if (code === "conflict") return;                       // the view reloads to the newer version
        if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].includes(code)) readOnly = true;
        saveMsg = code === "rate_limited" ? "Couldn't save yet: too many saves, try again in a minute." :
                  readOnly ? "" : "Couldn't save: the change is kept on this screen only.";
        render();
      }
    }, 1500);
    render();
  }

  root.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "onlyTodo") {
      onlyTodo = !onlyTodo;
      try { sessionStorage.setItem("etch-only-todo", onlyTodo ? "1" : "0"); } catch (err) {}
      render(); return;
    }
    if (b.dataset.id && !readOnly) {
      const it = data.items.find(i => i.id === b.dataset.id);
      if (it && it.status !== b.dataset.s) { it.status = b.dataset.s; scheduleSave(); }
    }
  });

  render();
  if (window.claude && claude.use) claude.use("artifact").then(a => {
    artifact = a;
    if (!a) { readOnly = true; render(); }
  });
  else { readOnly = true; render(); }
})();
</script>
